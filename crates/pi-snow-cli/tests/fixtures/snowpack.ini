[General]
BUFFER_SIZE = 370
BUFF_BEFORE = 1.5

[Input]
COORDSYS = UTM
COORDPARAM = 12N
TIME_ZONE = 0
METEO = SMET
METEOPATH = ./input
STATION1 = ULAMB1
SNOW = SMET
SNOWFILE1 = ULAMB1
SLOPE_FROM_SNO = true
PSUM_PH::create = PRECSPLITTING
PSUM_PH::PRECSPLITTING::type = RANGE
PSUM_PH::PRECSPLITTING::snow = 273.35
PSUM_PH::PRECSPLITTING::rain = 275.35

[Output]
COORDSYS = UTM
COORDPARAM = 12N
TIME_ZONE = 0
METEO = SMET
METEOPATH = ./output
SNOW = SMET
SNOW_WRITE = true
EXPERIMENT = hrrr-terrain-v1
TS_WRITE = true
TS_FORMAT = SMET
ACDD_WRITE = true
TS_START = 0.0
TS_DAYS_BETWEEN = 0.041666666666666664
PROF_WRITE = true
PROF_FORMAT = PRO
AGGREGATE_PRF = false
PROF_START = 0.0
PROF_DAYS_BETWEEN = 0.041666666666666664

[Snowpack]
MEAS_TSS = false
ENFORCE_MEASURED_SNOW_HEIGHTS = false
SW_MODE = INCOMING
MEAS_INCOMING_LONGWAVE = true
HEIGHT_OF_WIND_VALUE = 10.0
HEIGHT_OF_METEO_VALUES = 2.0
ATMOSPHERIC_STABILITY = MO_HOLTSLAG
ROUGHNESS_LENGTH = 0.002
CALCULATION_STEP_LENGTH = 10.0
CHANGE_BC = false
THRESH_CHANGE_BC = -1.0
SNP_SOIL = false
SOIL_FLUX = true
GEO_HEAT = 0.06
CANOPY = false

[SnowpackAdvanced]
FIXED_POSITIONS = 0.25 0.5 1.0 -0.25 -0.10
NUMBER_SLOPES = 1
SNOW_EROSION = false
SNOW_REDISTRIBUTION = false

[Interpolations1D]
WINDOW_SIZE = 3600
TA::resample = none
RH::resample = none
TSG::resample = none
VW::resample = none
DW::resample = none
ISWR::resample = none
ILWR::resample = none
PSUM::resample = accumulate
PSUM::accumulate::period = 600
PSUM::accumulate::strict = true
